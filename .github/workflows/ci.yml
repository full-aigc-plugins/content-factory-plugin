name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/content-factory-v1

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Supply-chain tests
        run: python -m unittest discover -s tests/supply-chain -p 'test_*.py' -v
